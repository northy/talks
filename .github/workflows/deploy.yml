name: Deploy slides on GitHub Pages
on:
  workflow_dispatch:
  push:
    branches: [master]
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build-knockin-on-headers-door:
    name: Build Knockin' on Header's Door
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./knockin-on-headers-door/presentation
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Setup Node JS
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: knockin-on-headers-door/presentation/package-lock.json
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --prefer-offline --no-audit --no-fund --foreground-scripts --loglevel=verbose
      - name: Build
        run: npm run build -- --base /knockin-on-headers-door/
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: knockin-on-headers-door
          path: knockin-on-headers-door/presentation/build
  build-shared-ptr-aliasing-ctor:
    name: Build shared_ptr aliasing constructor
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./lightning-talks/shared-ptr-aliasing-ctor
    steps:
      - uses: actions/checkout@v6
        with:
          lfs: true
      - name: Setup Node JS
        uses: actions/setup-node@v6
        with:
          node-version: 'lts/*'
          cache: 'npm'
          cache-dependency-path: lightning-talks/shared-ptr-aliasing-ctor/package-lock.json
      - name: Install dependencies
        timeout-minutes: 10
        run: npm ci --prefer-offline --no-audit --no-fund --foreground-scripts --loglevel=verbose
      - name: Build
        run: npm run build -- --base /lightning/shared-ptr-aliasing-ctor/
      - name: Upload build artifact
        uses: actions/upload-artifact@v7
        with:
          name: shared-ptr-aliasing-ctor
          path: lightning-talks/shared-ptr-aliasing-ctor/build
  stage:
    name: Stage all talks for Pages
    runs-on: ubuntu-latest
    needs: [build-knockin-on-headers-door, build-shared-ptr-aliasing-ctor]
    steps:
      - name: Download knockin-on-headers-door
        uses: actions/download-artifact@v8
        with:
          name: knockin-on-headers-door
          path: site/knockin-on-headers-door
      - name: Download shared-ptr-aliasing-ctor
        uses: actions/download-artifact@v8
        with:
          name: shared-ptr-aliasing-ctor
          path: site/lightning/shared-ptr-aliasing-ctor
      - name: Setup Pages
        uses: actions/configure-pages@v6
      - name: Upload pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: site
  deploy:
    name: Deploy on GitHub Pages
    runs-on: ubuntu-latest
    needs: stage
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
